# Netlify configuration for SPA routing

[build]
  # Build command for Vite
  command = "npm run build"
  # Directory to publish (Vite default)
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=dev"
  # Required for Puppeteer to run in Netlify's environment
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "false"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
